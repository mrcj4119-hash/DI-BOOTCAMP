<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #f4f7fb 0%, #e7eef9 100%);
        }

        #navbar {
            display: flex;
            align-items: center;
            gap: 2rem;
            min-height: 72px;
            padding: 0.75rem clamp(1rem, 5vw, 4rem);
            background: #ffffff;
            border-bottom: 1px solid #dbe3ef;
            box-shadow: 0 4px 18px rgb(23 32 51 / 8%);
        }

        .brand {
            color: #2155a3;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .welcome-message {
            color: #65728a;
            font-size: 0.95rem;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            margin-left: auto;
            color: #172033;
            font-weight: 600;
        }

        .user-profile img {
            width: 44px;
            height: 44px;
            border: 3px solid #dce9ff;
            border-radius: 50%;
            object-fit: cover;
        }

        main {
            max-width: 960px;
            margin: 0 auto;
            padding: clamp(3rem, 10vw, 7rem) 1rem;
            text-align: center;
        }

        h1 {
            margin: 0 0 0.75rem;
            font-size: clamp(2rem, 5vw, 3.5rem);
        }

        main p {
            margin: 0;
            color: #65728a;
            font-size: 1.05rem;
        }

        @media (max-width: 520px) {
            #navbar {
                gap: 0.75rem;
            }

            .welcome-message {
                display: none;
            }
        }
    </style>
</head>
<body>
    <nav id="navbar" aria-label="Main navigation">
        <span class="brand">My Website</span>
        <span class="welcome-message">Welcome back</span>
    </nav>
    <main>
        <h1>Welcome, John</h1>
        <p>You are successfully signed in.</p>
    </main>
    <script src="Exercise xp .js"></script>
</body>
</html>
