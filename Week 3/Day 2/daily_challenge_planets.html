<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: Create a solar system</title>
        <style>
            body {
                background-color: black;
                padding: 10px;
                font-family: Arial, sans-serif;
            }
            .listPlanets {
                display: flex;
                flex-wrap: wrap;
                gap: 30px;
                padding: 20px;
            }
            .planet {
                width: 100px;
                height: 100px;
                border-radius: 50%;
                text-align: center;
                padding: 10px;
                position: relative;
                border: 2px solid white;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            }
            .moon {
                position: absolute;
                width: 30px;
                height: 30px;
                border-radius: 50%;
                background: rgb(237, 237, 237);
                border: 5px solid red;
            }
        </style>
    </head>
    <body>
        <h1 style="color: white; text-align: center;">🌍 Solar System 🌍</h1>
        <section class="listPlanets"></section>

        <script src="daily challenge planets.js"></script>
    </body>
</html>
