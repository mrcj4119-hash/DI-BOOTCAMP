<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In / Sign Up Form</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #1C05F7;
    }

    .container {
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.15), 0 10px 10px rgba(0, 0, 0, 0.12);
      position: relative;
      overflow: hidden;
      width: 768px;
      max-width: 100%;
      min-height: 480px;
    }

    .form-container {
      position: absolute;
      top: 0;
      height: 100%;
      transition: all 0.6s ease-in-out;
    }

    .form-container form {
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 0 50px;
      height: 100%;
      text-align: center;
    }

    .form-container h1 {
      font-weight: 400;
      color: #333;
      margin-bottom: 8px;
      font-size: 32px;
    }

    .form-container p {
      font-size: 11px;
      font-weight: 700;
      color: #555;
      margin-bottom: 25px;
      letter-spacing: 0.3px;
    }

    .form-container input {
      background-color: #e3e3e3;
      border: none;
      padding: 12px 15px;
      margin: 8px 0;
      width: 100%;
      border-radius: 3px;
      outline: none;
      font-size: 13px;
    }

    .form-container input::placeholder {
      color: #777;
    }

    .form-container button {
      border: none;
      background-color: #f07178;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 45px;
      margin-top: 15px;
      cursor: pointer;
      border-radius: 3px;
      transition: background-color 0.2s ease;
    }

    .form-container button:hover {
      background-color: #e05e65;
    }

    .sign-in-form {
      left: 0;
      width: 50%;
      z-index: 2;
    }

    .sign-up-form {
      left: 0;
      width: 50%;
      opacity: 0;
      z-index: 1;
    }

    /* Container Animations */
    .container.right-panel-active .sign-in-form {
      transform: translateX(100%);
    }

    .container.right-panel-active .sign-up-form {
      transform: translateX(100%);
      opacity: 1;
      z-index: 5;
      animation: show 0.6s;
    }

    @keyframes show {
      0%, 49.99% {
        opacity: 0;
        z-index: 1;
      }
      50%, 100% {
        opacity: 1;
        z-index: 5;
      }
    }

    /* Overlay Styling */
    .overlay-container {
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      height: 100%;
      overflow: hidden;
      transition: transform 0.6s ease-in-out;
      z-index: 100;
    }

    .container.right-panel-active .overlay-container {
      transform: translateX(-100%);
    }

    .overlay {
      background: #e63946;
      color: #ffffff;
      position: relative;
      left: -100%;
      height: 100%;
      width: 200%;
      transform: translateX(0);
      transition: transform 0.6s ease-in-out;
    }

    .container.right-panel-active .overlay {
      transform: translateX(50%);
    }

    .overlay-panel {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 0 40px;
      text-align: center;
      top: 0;
      height: 100%;
      width: 50%;
      transform: translateX(0);
      transition: transform 0.6s ease-in-out;
    }

    .overlay-panel h1 {
      font-size: 32px;
      font-weight: 300;
      margin-bottom: 10px;
    }

    .overlay-panel span {
      font-size: 14px;
      margin-bottom: 20px;
    }

    .overlay-panel button {
      background-color: #ffffff;
      color: #e63946;
      border: none;
      padding: 10px 40px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 3px;
      transition: background-color 0.2s ease;
    }

    .overlay-panel button:hover {
      background-color: #f8f8f8;
    }

    .overlay-left {
      transform: translateX(-20%);
    }

    .container.right-panel-active .overlay-left {
      transform: translateX(0);
    }

    .overlay-right {
      right: 0;
      transform: translateX(0);
    }

    .container.right-panel-active .overlay-right {
      transform: translateX(20%);
    }
  </style>
</head>
<body>

  <div class="container" id="container">
    <!-- Sign Up Form (Right side initially) -->
    <div class="form-container sign-up-form">
      <form action="#">
        <h1>Sign Up</h1>
        <p>Please, Provide All The Correct Info To Create An Account</p>
        <input type="text" placeholder="Full Name" />
        <input type="email" placeholder="Email" />
        <input type="password" placeholder="Password" />
        <button type="button">Sign Up</button>
      </form>
    </div>

    <!-- Sign In Form (Left side initially) -->
    <div class="form-container sign-in-form">
      <form action="#">
        <h1>Log In</h1>
        <p>Please, Provide Your Login Credentials</p>
        <input type="email" placeholder="Email" />
        <input type="password" placeholder="Password" />
        <button type="button">Log In</button>
      </form>
    </div>

    <!-- Overlay Panel -->
    <div class="overlay-container">
      <div class="overlay">
        <!-- Overlay Shown when Sign Up form is visible -->
        <div class="overlay-panel overlay-left">
          <h1>Create Account</h1>
          <span>or</span>
          <button id="signInButton">Log In</button>
        </div>
        <!-- Overlay Shown when Sign In form is visible -->
        <div class="overlay-panel overlay-right">
          <h1>Create Account</h1>
          <span>or</span>
          <button id="signUpButton">Log In</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const container = document.getElementById('container');
    const signUpBtn = document.getElementById('signUpButton');
    const signInBtn = document.getElementById('signInButton');

    signUpBtn.addEventListener('click', () => {
      container.classList.add('right-panel-active');
    });

    signInBtn.addEventListener('click', () => {
      container.classList.remove('right-panel-active');
    });
  </script>

</body>
</html>
