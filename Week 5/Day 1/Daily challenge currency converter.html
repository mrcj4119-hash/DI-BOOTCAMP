<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
    <style>
        :root { --ink: #172334; --muted: #738092; --blue: #2164e8; --pale: #eef4ff; --line: #dbe4f1; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; color: var(--ink); font-family: 'DM Sans', sans-serif; background: #f8fbff; background-image: linear-gradient(135deg, rgba(33,100,232,.1), transparent 34%), radial-gradient(#d9e6ff 1px, transparent 1px); background-size: auto, 20px 20px; }
        main { width: min(92vw, 760px); padding: 2rem 0; }
        .header { margin-bottom: 1.5rem; }
        .eyebrow { margin: 0 0 .5rem; color: var(--blue); font-size: .72rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
        h1 { margin: 0; font: 700 clamp(2.4rem, 7vw, 4.5rem)/.95 'Space Grotesk', sans-serif; letter-spacing: -.04em; }
        .header p:last-child { max-width: 440px; margin: .9rem 0 0; color: var(--muted); }
        .converter { padding: clamp(1.3rem, 5vw, 2.5rem); border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,.94); box-shadow: 0 24px 60px rgba(38, 71, 122, .15); }
        .amount-label, .field-label { display: block; margin-bottom: .5rem; color: var(--muted); font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
        .amount { width: 100%; padding: .8rem 0; border: 0; border-bottom: 2px solid var(--line); color: var(--ink); background: transparent; font: 700 2rem 'Space Grotesk', sans-serif; outline: none; }
        .amount:focus { border-color: var(--blue); }
        .currency-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: .8rem; margin-top: 1.8rem; }
        select { width: 100%; padding: .9rem; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: var(--pale); font: 700 1rem 'DM Sans', sans-serif; cursor: pointer; }
        .switch { width: 42px; height: 42px; margin: 0 0 .05rem; padding: 0; border: 1px solid var(--blue); border-radius: 50%; color: var(--blue); background: white; cursor: pointer; }
        .switch:hover { color: white; background: var(--blue); }
        .convert { width: 100%; margin-top: 1.7rem; padding: 1rem; border: 0; border-radius: 8px; color: white; background: var(--blue); cursor: pointer; font: 700 1rem 'DM Sans', sans-serif; transition: transform 160ms, box-shadow 160ms; }
        .convert:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(33,100,232,.24); }
        button:focus-visible, select:focus-visible { outline: 3px solid #9bbcff; outline-offset: 3px; }
        button:disabled { cursor: wait; opacity: .6; }
        .result-box { margin-top: 1.5rem; padding: 1.4rem; border-radius: 12px; background: var(--pale); text-align: center; }
        #result { margin: 0; color: var(--blue); font: 700 clamp(1.8rem, 6vw, 3rem) 'Space Grotesk', sans-serif; }
        #rate { min-height: 1.3em; margin: .45rem 0 0; color: var(--muted); font-size: .88rem; }
        #result.error { color: #c23645; font-size: 1rem; font-family: 'DM Sans', sans-serif; }
        @media (max-width: 480px) { .currency-row { grid-template-columns: 1fr; align-items: stretch; } .switch { justify-self: center; transform: rotate(90deg); } }
    </style>
</head>
<body>
    <main>
        <header class="header"><p class="eyebrow"></p><h1>Currency converter</h1><p>Convert money quickly using live exchange rates from ExchangeRate API.</p></header>
        <section class="converter" aria-label="Currency converter">
            <label class="amount-label" for="amount">Amount</label>
            <input id="amount" class="amount" type="number" min="0" step="any" value="100" placeholder="0.00">
            <div class="currency-row">
                <label><span class="field-label">From</span><select id="from-currency" aria-label="Currency to convert from"><option>Loading...</option></select></label>
                <button id="switch-button" class="switch" type="button" title="Switch currencies" aria-label="Switch currencies"><i class="fa-solid fa-arrow-right-arrow-left"></i></button>
                <label><span class="field-label">To</span><select id="to-currency" aria-label="Currency to convert to"><option>Loading...</option></select></label>
            </div>
            <button id="convert-button" class="convert" type="button">Convert currency <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
            <div class="result-box" aria-live="polite"><p id="result">Add your API key to begin</p><p id="rate"></p></div>
        </section>
    </main>
    <script src="Daily challenge currency converter.js"></script>
</body>
</html>
