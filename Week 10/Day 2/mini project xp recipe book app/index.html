<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Save, organize, and revisit your favorite recipes."
    />
    <title>Gather | Recipe Book</title>
  </head>
  <body>
    <main class="recipe-app">
      <header class="page-header">
        <p class="eyebrow">Your kitchen notebook</p>
        <h1>Gather <span>&amp;</span> savor</h1>
        <p class="page-intro">A little collection of recipes worth coming back to.</p>
      </header>

      <section class="entry-panel" aria-labelledby="entry-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Make something lovely</p>
            <h2 id="entry-heading">Add a recipe</h2>
          </div>
          <span class="heading-mark" aria-hidden="true">✳</span>
        </div>
        <form id="recipeEntryForm">
          <label class="field">
            <span>Recipe title</span>
            <input
              type="text"
              id="recipeTitle"
              name="recipeTitle"
              placeholder="e.g. Sunday lemon cake"
              required
            />
          </label>
          <label class="field">
            <span>Ingredients <small>one per line</small></span>
            <textarea
              id="ingredients"
              name="ingredients"
              placeholder="2 lemons&#10;1 cup flour&#10;..."
              rows="4"
              required
            ></textarea>
          </label>
          <label class="field">
            <span>Instructions</span>
            <textarea
              id="instructions"
              name="instructions"
              placeholder="How do you make it?"
              rows="4"
              required
            ></textarea>
          </label>
          <button class="button button-primary" type="submit">
            Add to my recipe book <span aria-hidden="true">＋</span>
          </button>
        </form>
      </section>

      <section class="collection-section" aria-labelledby="collection-heading">
        <div class="section-heading collection-heading">
          <div>
            <p class="eyebrow">Collected with care</p>
            <h2 id="collection-heading">My recipes</h2>
          </div>
          <button class="button button-quiet" id="clearRecipesButton" type="button">
            Clear all
          </button>
        </div>
        <p id="appMessage" class="app-message" role="status" aria-live="polite"></p>
        <div id="recipeContainer" class="recipe-grid"></div>
      </section>
      <footer>Made for the recipes that bring everyone to the table.</footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
