<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.5;
      margin: 2rem auto;
      max-width: 32rem;
      padding: 0 1rem;
    }

    form {
      border: 1px solid #ccc;
      padding: 1.5rem;
    }

    label {
      display: block;
      margin-top: 1rem;
    }

    input[type="text"] {
      box-sizing: border-box;
      display: block;
      margin-top: 0.25rem;
      padding: 0.5rem;
      width: 100%;
    }

    input[type="submit"] {
      margin-top: 1.5rem;
      padding: 0.5rem 1rem;
    }
  </style>
</head>
<body>
  <h1>Welcome</h1>

  <form action="exercise xp gold result.html" method="get">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" required>

    <label for="lastname">Last name</label>
    <input id="lastname" name="lastname" type="text" required>

    <input type="submit" value="Send">
  </form>
</body>
</html>
