<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunrise Pair</title>
    <style>
        :root {
            --ink: #192542;
            --muted: #65708c;
            --yellow: #ffb84d;
            --coral: #f46f72;
            --paper: #fffdf7;
        }

        * { box-sizing: border-box; }

        body {
            background:
                radial-gradient(circle at 8% 12%, #ffe9a8, transparent 27%),
                radial-gradient(circle at 90% 14%, #ffc1b7, transparent 30%),
                linear-gradient(135deg, #c8f3eb, #e7dcff 56%, #fff0bf);
            color: var(--ink);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            margin: 0;
            min-height: 100vh;
            padding: 3rem 1.25rem;
        }

        main { margin: auto; max-width: 980px; }

        header { margin-bottom: 2rem; text-align: center; }

        .eyebrow {
            color: #d75c63;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(2.7rem, 8vw, 5.5rem);
            letter-spacing: -0.05em;
            line-height: 0.95;
            margin: 0.55rem 0 0.8rem;
        }

        header p { color: var(--muted); margin: 0; }

        form {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(2, 1fr);
        }

        fieldset {
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid white;
            border-radius: 22px;
            box-shadow: 0 16px 40px rgba(52, 43, 94, 0.12);
            padding: 1.25rem;
        }

        legend { font-size: 1.2rem; font-weight: 800; padding: 0 0.5rem; }

        label { color: var(--muted); display: block; font-size: 0.85rem; font-weight: 700; margin-top: 0.75rem; }

        input {
            background: var(--paper);
            border: 2px solid transparent;
            border-radius: 12px;
            color: var(--ink);
            font: inherit;
            margin-top: 0.3rem;
            padding: 0.75rem;
            width: 100%;
        }

        input:focus { border-color: var(--yellow); outline: none; }

        form > button {
            background: linear-gradient(135deg, var(--coral), #ff9e54);
            border: 0;
            border-radius: 14px;
            color: white;
            cursor: pointer;
            font: inherit;
            font-weight: 800;
            grid-column: 1 / -1;
            justify-self: center;
            padding: 0.9rem 1.5rem;
        }

        #results {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(2, 1fr);
            margin-top: 2rem;
        }

        #results article {
            background: var(--paper);
            border-left: 8px solid var(--yellow);
            border-radius: 18px;
            box-shadow: 0 14px 30px rgba(52, 43, 94, 0.12);
            padding: 1.5rem;
        }

        #results h2 { margin: 0; }
        #results p { color: #d75c63; font-size: 2rem; font-weight: 800; margin: 0.75rem 0 0; }

        @media (max-width: 650px) {
            body { padding: 2rem 1rem; }
            form, #results { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <div class="eyebrow">sunrise check</div>
            <h1>Catch the first light.</h1>
            <p>Compare sunrise times for two cities in one request.</p>
        </header>
        <form id="sunrise-form">
            <fieldset>
                <legend>First city</legend>
                <label>City name <input name="first-city" value="Paris" required></label>
                <label>Latitude <input name="first-latitude" type="number" step="any" value="48.864716" required></label>
                <label>Longitude <input name="first-longitude" type="number" step="any" value="2.349014" required></label>
            </fieldset>
            <fieldset>
                <legend>Second city</legend>
                <label>City name <input name="second-city" value="New York" required></label>
                <label>Latitude <input name="second-latitude" type="number" step="any" value="40.730610" required></label>
                <label>Longitude <input name="second-longitude" type="number" step="any" value="-73.935242" required></label>
            </fieldset>
            <button type="submit">Compare sunrise times</button>
        </form>
        <section id="results" aria-live="polite"></section>
    </main>
    <script src="Daily challenge promise all.js"></script>
</body>
</html>
