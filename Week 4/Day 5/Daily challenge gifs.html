<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random GIF Generator</title>
    <style>
        :root {
            --ink: #18233f;
            --pink: #f24f8b;
            --orange: #ff9d4d;
            --mint: #c9f5e8;
            --paper: #fffaf3;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background:
                radial-gradient(circle at 12% 12%, #ffe28a 0, transparent 28%),
                radial-gradient(circle at 88% 18%, #ffb3d1 0, transparent 30%),
                linear-gradient(135deg, var(--mint), #e3d8ff 55%, #fff1c8);
            color: var(--ink);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            margin: 0;
            min-height: 100vh;
            padding: 3rem 1.25rem;
        }

        main {
            margin: auto;
            max-width: 1100px;
        }

        header {
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .eyebrow {
            color: #d33472;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 5.5rem);
            letter-spacing: -0.05em;
            line-height: 0.95;
            margin: 0.55rem 0 0.8rem;
        }

        header p {
            color: #68718d;
            margin: 0 auto;
            max-width: 520px;
        }

        .controls {
            backdrop-filter: blur(16px);
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid white;
            border-radius: 24px;
            box-shadow: 0 20px 55px rgba(52, 43, 94, 0.16);
            margin: 0 auto 1.5rem;
            max-width: 780px;
            padding: 1.25rem;
        }

        form {
            display: flex;
            gap: 0.75rem;
        }

        label {
            left: -9999px;
            position: absolute;
        }

        input,
        button {
            border: 0;
            border-radius: 14px;
            font: inherit;
            min-height: 52px;
            padding: 0.75rem 1rem;
        }

        input {
            background: var(--paper);
            border: 2px solid transparent;
            color: var(--ink);
            flex: 1;
            min-width: 0;
            outline: none;
        }

        input:focus {
            border-color: #36c8d3;
        }

        button {
            color: white;
            cursor: pointer;
            font-weight: 800;
            transition: transform 160ms ease, box-shadow 160ms ease;
        }

        button:hover {
            box-shadow: 0 8px 18px rgba(23, 33, 59, 0.2);
            transform: translateY(-2px);
        }

        form button {
            background: linear-gradient(135deg, var(--pink), #ff7466);
        }

        #delete-all {
            background: var(--ink);
            display: block;
            margin: 0 auto 1rem;
        }

        #message {
            color: #68718d;
            min-height: 1.5rem;
            text-align: center;
        }

        #gif-gallery {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        }

        #gif-gallery article {
            animation: appear 300ms ease both;
            background: rgba(255, 255, 255, 0.7);
            border: 5px solid white;
            border-radius: 20px;
            box-shadow: 0 12px 24px rgba(52, 43, 94, 0.14);
            overflow: hidden;
            padding-bottom: 0.65rem;
        }

        #gif-gallery img {
            aspect-ratio: 1 / 1;
            display: block;
            object-fit: cover;
            width: 100%;
        }

        #gif-gallery article button {
            background: #e84168;
            display: block;
            margin: 0.65rem auto 0;
            min-height: 40px;
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(12px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (max-width: 560px) {
            body { padding: 2rem 1rem; }
            form { flex-direction: column; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <div class="eyebrow">Random GIF generator</div>
            <h1>Give me a mood.</h1>
            <p>Search a category and collect one surprise GIF at a time.</p>
        </header>
        <section class="controls" aria-label="GIF controls">
            <form id="gif-form">
                <label for="category">GIF category</label>
                <input id="category" name="category" type="text" placeholder="Try: sunny, pizza, dancing..." required>
                <button type="submit">Add random GIF</button>
            </form>
        </section>
        <button id="delete-all" type="button">DELETE ALL</button>
        <p id="message" aria-live="polite">Your gallery is ready.</p>
        <section id="gif-gallery" aria-live="polite"></section>
    </main>
    <script src="Daily challenge gifs.js"></script>
</body>
</html>
