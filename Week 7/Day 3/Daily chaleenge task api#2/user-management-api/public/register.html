<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    form { display: flex; flex-direction: column; width: 300px; gap: 0.5rem; }
    input { padding: 0.5rem; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .message { margin-top: 1rem; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Register Form</h2>
  <form id="registerForm">
    <input type="text" id="name" placeholder="Name" required />
    <input type="text" id="lastName" placeholder="Last Name" required />
    <input type="email" id="email" placeholder="Email" required />
    <input type="text" id="username" placeholder="Username" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit" id="submitBtn" disabled>Register</button>
  </form>
  <div id="responseMessage" class="message"></div>

  <script>
    const form = document.getElementById('registerForm');
    const inputs = form.querySelectorAll('input');
    const submitBtn = document.getElementById('submitBtn');
    const responseMessage = document.getElementById('responseMessage');

    // Enable button only when ALL inputs have text
    function checkInputs() {
      const allFilled = Array.from(inputs).every(input => input.value.trim() !== '');
      submitBtn.disabled = !allFilled;
    }

    inputs.forEach(input => input.addEventListener('input', checkInputs));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        name: document.getElementById('name').value.trim(),
        lastName: document.getElementById('lastName').value.trim(),
        email: document.getElementById('email').value.trim(),
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value.trim()
      };

      try {
        const res = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        responseMessage.textContent = res.ok ? data.message : (data.error || 'Registration failed');
      } catch (err) {
        responseMessage.textContent = 'Error connecting to server.';
      }
    });
  </script>
</body>
</html>
